            "h": 4,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "ml_anomaly_cycle_step + 1",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "orientation": "auto",
            "justifyMode": "center",
            "colorMode": "value"
          }
        },
        {
          "id": 4,
          "type": "table",
          "title": "Aktive Diagnose",
          "description": "Konsolidierte Diagnose: Anomalietyp, Root Cause, Trigger und Remediation.",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "ml_anomaly_diagnostic_active",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "instance": true,
                  "job": true
                },
                "indexByName": {
                  "anomaly_type": 0,
                  "root_cause": 1,
                  "trigger_feature": 2,
                  "remediation": 3
                },
                "renameByName": {
                  "anomaly_type": "Anomalietyp",
                  "root_cause": "Root Cause",
                  "trigger_feature": "Trigger",
                  "remediation": "Remediation"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Data Drift – PSI und KS",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "expr": "ml_anomaly_drift_psi",
              "legendFormat": "PSI – {{feature}}",
              "refId": "A"
            },
            {
              "expr": "ml_anomaly_drift_ks_pvalue",
              "legendFormat": "KS p-value – {{feature}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
