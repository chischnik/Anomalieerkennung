# Kubernetes-Deployment für die aktuelle ML-Anomalieerkennung
# Architektur: Elec2 -> ML-Anomalie-Service -> Prometheus -> Grafana

apiVersion: v1
kind: Namespace
metadata:
  name: ml-monitoring

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-anomalie-service
  namespace: ml-monitoring
  labels:
    app: ml-anomalie-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-anomalie-service
  template:
    metadata:
      labels:
        app: ml-anomalie-service
    spec:
      containers:
      - name: ml-anomalie-service
        image: ml-anomalie-service:demo
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ml-anomalie-service
  namespace: ml-monitoring
  labels:
    app: ml-anomalie-service
spec:
  selector:
    app: ml-anomalie-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ml-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "ml-anomalie-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["ml-anomalie-service:8000"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ml-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ml-monitoring
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
  type: NodePort

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: ml-monitoring
data:
  grafana-prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ml-monitoring
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: "Masterarbeit"
        orgId: 1
        folder: "Masterarbeit"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
