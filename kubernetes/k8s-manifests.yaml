          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Pod-Restarts",
          "description": "Aktuelle Anzahl der Pod-Restarts.",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "ml_anomaly_pod_restarts_total",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
