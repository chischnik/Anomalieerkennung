        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Kontrollierte Infrastrukturindikatoren",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "expr": "ml_anomaly_cpu_usage_percent",
              "legendFormat": "CPU (%)",
              "refId": "A"
            },
            {
              "expr": "ml_anomaly_memory_usage_percent",
              "legendFormat": "Memory (%)",
              "refId": "B"
            },
            {
              "expr": "ml_anomaly_pod_restarts_total",
              "legendFormat": "Pod-Restarts",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
