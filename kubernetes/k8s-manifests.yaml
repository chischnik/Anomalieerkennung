          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "Value": true
                },
                "indexByName": {
                  "Time": 0,
                  "anomaly_type": 1,
                  "root_cause": 2,
                  "trigger_feature": 3,
                  "remediation": 4
                },
                "renameByName": {
                  "Time": "Zeit",
                  "anomaly_type": "Anomalietyp",
                  "root_cause": "Root Cause",
                  "trigger_feature": "Trigger",
                  "remediation": "Remediation"
