            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "ml_anomaly_system_classification",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "NORMAL"
                    },
                    "1": {
                      "text": "ANOMALY"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "orientation": "auto",
            "justifyMode": "center",
            "colorMode": "value"
