              "refId": "A"
            },
            {
              "expr": "ml_anomaly_nswdemand",
              "legendFormat": "NSW Demand",
              "refId": "B"
            },
            {
              "expr": "ml_anomaly_vicprice",
              "legendFormat": "VIC Price",
              "refId": "C"
            },
            {
              "expr": "ml_anomaly_vicdemand",
